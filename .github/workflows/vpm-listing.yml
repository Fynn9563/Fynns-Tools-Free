name: VPM listing

on:
  workflow_run:
    workflows: [Unity packages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpm-listing
  cancel-in-progress: false

jobs:
  listing:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test listing generator
        run: python -m unittest discover -s scripts/tests -p test_vpm_listing.py

      - name: Generate listing from published releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/build-vpm-listing.py --repository "$REPOSITORY" --branch "$DEFAULT_BRANCH"

      - uses: actions/upload-artifact@v7
        with:
          name: vpm-listing
          path: vpm.json
          if-no-files-found: error

      - name: Update repository listing
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- vpm.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update VPM package listing"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
